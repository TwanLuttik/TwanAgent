[package]
name = "twanagent-service"
version = "1.0.0-beta.7"
edition = "2021"
license = "MIT"
description = "TwanAgent project engine, shared by the app and the headless server"
publish = false

[lints.rust]
dead_code = "deny"
unused = "deny"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.26"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "twanagent-server"
path = "src/bin/twanagent-server.rs"

[package]
name = "twanagent"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "TwanAgent desktop"

# Unused items fail the build, the way ESLint fails on unused code.
# `dead_code` covers unused functions, methods, structs, enums, and fields.
# `unused` covers unused imports, variables, and other unused names.
# Tests and items reached only from tests are not flagged.
[lints.rust]
dead_code = "deny"
unused = "deny"

[lib]
name = "twanagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros", "process", "net", "io-util", "sync"] }
async-trait = "0.1"
russh = { version = "0.54", features = ["ring"] }
rand = "0.8"
tauri = { version = "2", features = ["protocol-asset"] }
portable-pty = "0.8"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
symphonia = { version = "0.6", default-features = false, features = ["wav", "mp3", "ogg", "isomp4", "aac", "pcm"] }
whisper-rs = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
tao = { path = "patches/tao" }
serialize-to-javascript = { path = "patches/serialize-to-javascript" }
tauri = { path = "patches/tauri" }

name: Release

# Push a v* tag, or run this by hand, to publish one GitHub release.
# The tag is the desktop version (`v1.0.0-beta.5`). The same release also
# carries `twanagent-server` binaries. Their version is the service crate
# version, which can move without the desktop version moving.
#
# Assets:
#   TwanAgent_<version>_universal.app.tar.gz
#   TwanAgent_<version>_x64-setup.exe
#   twanagent-server-<server>-aarch64-apple-darwin
#   twanagent-server-<server>-x86_64-apple-darwin
#   twanagent-server-<server>-aarch64-unknown-linux-gnu
#   twanagent-server-<server>-x86_64-unknown-linux-gnu
#   twanagent-server-<server>-x86_64-pc-windows-msvc.exe
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend
        run: npm ci

      - name: Import Apple certificate
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "No Developer ID certificate. The app will be ad-hoc signed."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          identity=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "The certificate has no Developer ID Application identity." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          rm -f certificate.p12

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          APPLE_SIGNING_IDENTITY: ${{ steps.apple.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: TwanAgent v__VERSION__
          releaseBody: |
            macOS: download `TwanAgent.app.tar.gz`, unpack it, and move TwanAgent to Applications.

            Windows: download the x64 `TwanAgent_*-setup.exe` installer. Windows builds are unsigned.

            Server: `twanagent-server-<version>-<target>` is the headless program. The version in that name is the service crate, not the desktop tag. Targets are `aarch64-apple-darwin`, `x86_64-apple-darwin`, `aarch64-unknown-linux-gnu`, `x86_64-unknown-linux-gnu`, and `x86_64-pc-windows-msvc.exe`.

            An ad-hoc signed build still needs to be allowed once in System Settings, Privacy & Security. A Developer ID signature and notarization need the Apple secrets listed in the workflow file.
          releaseDraft: false
          prerelease: true
          args: --target universal-apple-darwin --bundles app --skip-stapling

  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NASM
        run: |
          choco install nasm -y
          $nasm = Join-Path $env:ProgramFiles 'NASM'
          if (!(Test-Path (Join-Path $nasm 'nasm.exe'))) {
            throw 'NASM installed, but nasm.exe was not found.'
          }
          "$nasm" >> $env:GITHUB_PATH

      - name: Configure LLVM for Whisper bindings
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            throw 'The Windows runner needs LLVM with libclang.'
          }
          $resourceDir = & (Join-Path $llvmBin 'clang.exe') --print-resource-dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msvcInclude = Join-Path $env:VCToolsInstallDir 'include'
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-msvc -resource-dir `"$resourceDir`" -isystem `"$msvcInclude`"" >> $env:GITHUB_ENV

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend from the committed lockfile
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- package-lock.json bun.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend tests
        run: bun run test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Check Windows target
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc

      - name: Build unsigned NSIS installer
        run: bun run tauri build --target x86_64-pc-windows-msvc --bundles nsis --no-sign --ci

      - name: Build the Windows server
        run: cargo build --manifest-path src-tauri/service/Cargo.toml --locked --release --target x86_64-pc-windows-msvc --bin twanagent-server

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TwanAgent-windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload the Windows server
        uses: actions/upload-artifact@v4
        with:
          name: twanagent-server-windows
          path: src-tauri/service/target/x86_64-pc-windows-msvc/release/twanagent-server.exe
          if-no-files-found: error

  server-macos:
    name: twanagent-server macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/service

      - name: Build macOS servers
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --manifest-path src-tauri/service/Cargo.toml --locked --release --target "$target" --bin twanagent-server
          done
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/service/Cargo.toml | head -n 1)
          mkdir -p server-dist
          cp "src-tauri/service/target/aarch64-apple-darwin/release/twanagent-server" "server-dist/twanagent-server-${version}-aarch64-apple-darwin"
          cp "src-tauri/service/target/x86_64-apple-darwin/release/twanagent-server" "server-dist/twanagent-server-${version}-x86_64-apple-darwin"

      - name: Upload macOS servers
        uses: actions/upload-artifact@v4
        with:
          name: twanagent-server-macos
          path: server-dist/twanagent-server-*
          if-no-files-found: error

  server-linux:
    name: twanagent-server Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/service

      - name: Install cross-linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu
          mkdir -p "$HOME/.cargo"
          cat >> "$HOME/.cargo/config.toml" <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          [target.x86_64-unknown-linux-gnu]
          linker = "x86_64-linux-gnu-gcc"
          EOF

      - name: Build Linux servers
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CC_x86_64_unknown_linux_gnu: x86_64-linux-gnu-gcc
        run: |
          set -euo pipefail
          for target in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            cargo build --manifest-path src-tauri/service/Cargo.toml --locked --release --target "$target" --bin twanagent-server
          done
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/service/Cargo.toml | head -n 1)
          mkdir -p server-dist
          cp "src-tauri/service/target/aarch64-unknown-linux-gnu/release/twanagent-server" "server-dist/twanagent-server-${version}-aarch64-unknown-linux-gnu"
          cp "src-tauri/service/target/x86_64-unknown-linux-gnu/release/twanagent-server" "server-dist/twanagent-server-${version}-x86_64-unknown-linux-gnu"

      - name: Upload Linux servers
        uses: actions/upload-artifact@v4
        with:
          name: twanagent-server-linux
          path: server-dist/twanagent-server-*
          if-no-files-found: error

  publish-windows:
    name: Attach Windows installer and servers
    needs: [macos, windows, server-macos, server-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TwanAgent-windows-x86_64
          path: windows-installer
      - uses: actions/download-artifact@v4
        with:
          name: twanagent-server-macos
          path: server-dist
      - uses: actions/download-artifact@v4
        with:
          name: twanagent-server-linux
          path: server-dist
      - uses: actions/download-artifact@v4
        with:
          name: twanagent-server-windows
          path: server-windows
      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          server=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/service/Cargo.toml | head -n 1)
          mv "server-windows/twanagent-server.exe" "server-dist/twanagent-server-${server}-x86_64-pc-windows-msvc.exe"
          gh release upload "v$version" windows-installer/*-setup.exe server-dist/twanagent-server-* --clobber
